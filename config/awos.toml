# AgentWorkOS default configuration (committed; NO secrets here).
# Machine-specific overrides go to config/local.toml (gitignored). Secrets go to var/secrets.toml (gitignored).

timezone = "Asia/Shanghai"           # system clock is UTC-4; all wall-clock logic uses this zone

[server]
host = "127.0.0.1"          # localhost only by default
port = 8765

[paths]
# Relative paths are resolved against the AgentWorkOS root.
var = "var"
workspaces = "var/workspaces"
artifacts = "var/artifacts"
logs = "var/logs"
runs = "var/runs"
backups = "var/backups"
context = "var/context"
inbox_drop = "var/inbox-drop"          # drop .md/.txt files here to create inbox items
node_runtime = "runtime/node"          # portable Node >= 22.19 for pi / dsh

[scheduler]
tick_seconds = 60                     # scheduler wake-up; was 15, slowed on user request
lease_seconds = 300                    # task lease; heartbeat renews it
max_concurrent_runs = 4                # was 3: more cheap executors to hand work to
max_agent_processes = 6                # global cap on agent subprocesses across all executors
quiet_hours = ["01:30", "09:30"]       # Beijing time; user works ~12:00-24:00. Only risk=high notifies here
autostart_max_level = 5                # tasks up to this level start automatically after triage
autostart_min_priority = 3             # P0..P3 all eligible
retry_backoff_seconds = [60, 300, 1800]

[executors.codex]
enabled = true
command = "codex"
model = ""                             # empty = codex default from ~/.codex/config.toml
max_concurrent = 2
timeout_seconds = 1800

[executors.claude]
enabled = true
command = "claude"
model = "sonnet"
triage_model = "haiku"
max_concurrent = 2
timeout_seconds = 1500
max_budget_usd_per_run = 1.5

[executors.pi]
enabled = true
command = "pi"
model = "deepseek/deepseek-v4-pro"
max_concurrent = 2
allow_write = false                    # Pi has no sandbox/permission system: read-only work only (analysis, verification)
timeout_seconds = 1500

[executors.dsh]
enabled = true
# DSH reports tokens only; these are ESTIMATED prices (USD per million tokens) used for budget accounting
usd_per_mtok_in = 0.5
usd_per_mtok_cached = 0.05
usd_per_mtok_out = 2.0
command = "dsh"
max_concurrent = 2
timeout_seconds = 1500

[routing]
# Task work is routed by IMPORTANCE x DIFFICULTY (engine/router.py): the tier decides who goes first; explanations are kept in
# task.meta.routing and shown on the task page. Pi has no sandbox of its own, so it only gets read-only work (executors.pi.allow_write).
#   economy  = routine, low-stakes work       -> cheap DeepSeek executors first (dsh / pi), codex and claude as the safety net
#   standard = ordinary work                  -> codex first (subscription, no marginal cost), dsh next
#   premium  = hard or important work         -> claude / codex first; the cheap executors only as a last resort
# Personal matters: only the executors already trusted with mail/private content (codex, claude). Mail-derived tasks always are.
private_categories = ["comms", "career", "admin", "schedule"]
# Work whose result reaches other people counts as important from L3 up.
high_stakes_categories = ["comms", "career", "admin", "schedule"]
verify = ["dsh", "pi", "codex", "claude"]
# topic recaps contain the user's mail/repo context: only the executors already trusted with it (Codex is free per run)
brief = ["codex", "claude"]
# category -> preferred executor order (first enabled wins). Planner/triage may override per task.
triage = ["claude", "codex"]
plan = ["codex", "claude"]
dev = ["codex", "pi", "dsh", "claude"]
research = ["codex", "claude"]
writing = ["claude", "codex"]
doc = ["claude", "codex"]
data = ["codex", "claude"]
# Cost control: routine categories go to Codex first (subscription, no marginal cost); Claude (pay-per-use,
# ~$0.47 per execute run) stays first only for writing/doc, where it is clearly better.
pm = ["codex", "claude"]
schedule = ["codex", "claude"]
comms = ["codex", "claude"]
admin = ["codex", "claude"]
career = ["codex", "claude"]
learning = ["codex", "claude"]
system = ["codex", "claude"]
other = ["codex", "claude"]

[routing.tiers.economy]
readonly = ["dsh", "pi", "codex", "claude"]
write = ["dsh", "codex", "claude"]
[routing.tiers.standard]
readonly = ["codex", "dsh", "pi", "claude"]
write = ["codex", "dsh", "claude"]
[routing.tiers.premium]
readonly = ["claude", "codex", "dsh", "pi"]
write = ["claude", "codex", "dsh"]
# In the standard and premium tiers the executor that is best at the category goes first (a triage hint is a soft preference).
[routing.affinity]
codex = ["dev", "data", "system", "research"]
claude = ["writing", "doc", "comms", "career", "pm", "schedule", "admin"]

[guardian]
# Once a day (Beijing time, from this hour) every project's health is checked; a project that is at risk or stalled gets one
# read-only analysis task (what is it stuck on, what is the smallest next step). At most 3 per day, a week of quiet per project.
enabled = true
hour = 11

[budget]
daily_usd = 15.0                       # pay-per-use executors (claude, pi, dsh share it); hard stop when exceeded. Raised from 8 on the user's request
per_task_usd = 5.0                     # was 3
codex_daily_runs = 90                  # subscription executor: cap number of runs/day (was 60)

[runtimes]
# Agent CLIs installed by `awos setup` into runtime/<name> (pinned; npm, no lifecycle scripts). A CLI already on PATH wins.
codex = "@openai/codex@0.167.0"
pi = "@earendil-works/pi-coding-agent@1.5.0"
dsh = "@deepseek-ai/dsh@0.2.2-rc.1"

[sandbox]
# Least privilege for every agent process (executors/sandbox.py). macOS: Claude Code's and Codex's / DSH's own Seatbelt
# sandboxes are switched on; Pi (no sandbox of its own) runs under sandbox-exec. Credential files are unreadable.
enabled = true
deny_read = []                         # extra absolute paths agents must never read
# Domains agents' shell commands may reach (package registries, code hosting, mirrors). Unset = the built-in list in
# executors/sandbox.py DEFAULT_DOMAINS; setting it replaces that list. Anything else: the agent (or the system, from what
# it saw blocked) proposes `grant_network`, you approve, the task re-runs with those domains.
# allowed_domains = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org", "github.com"]

[sensors.git]
enabled = true
interval_minutes = 180
roots = ["D:/papers", "D:/phd", "D:/transfer", "D:/personal"]
max_depth = 4
stale_dirty_hours = 48                 # uncommitted changes older than this become a signal
stale_unpushed_hours = 24              # unpushed commits older than this become a signal
recent_days = 14                       # "recent activity" window (no-remote backup-risk check, context snapshot)
exclude = []                           # extra absolute paths to skip (AgentWorkOS var/external/runtime always skipped)

[sensors.files]
enabled = true
interval_minutes = 360
roots = ["D:/papers", "D:/phd", "D:/transfer"]
extensions = [".docx", ".doc", ".pptx", ".xlsx", ".pdf", ".md", ".tex", ".txt"]
lookback_days = 7
max_depth = 5
group_depth = 1                        # project folder = <root>/<first-level folder>
deadline_ahead_days = 60               # dates in file names this far ahead count as deadline hints
exclude = []

[sensors.agent_history]
enabled = true
interval_minutes = 360
lookback_days = 7
signal_days = 2                        # emit (project, day) signals for today + yesterday; older days -> context only

[sensors.zotero]
enabled = true
interval_minutes = 720
data_dir = "D:/zotero"                 # sqlite fallback only; local API on 127.0.0.1:23119 is preferred
lookback_days = 7                      # first-run window

[sensors.inbox_drop]
enabled = true
interval_minutes = 10

[sensors.mailmaster]
enabled = true
interval_minutes = 60
root = "D:/MailMasterData"             # NetEase Mail Master local store (plain SQLite, read-only)
lookback_days = 3
active_hours = ["09:00", "01:30"]

[sensors.gmail]
enabled = true
interval_minutes = 360
active_hours = ["09:00", "01:30"]
lookback_hours = 24
min_importance = 3                     # items with action=none and no deadline need at least this importance
timeout_s = 600

[sensors.notion]
enabled = true
interval_minutes = 720
active_hours = ["09:00", "01:30"]
recent_days = 3
ahead_days = 14
timeout_s = 600

[sensors.github]
enabled = true
interval_minutes = 120               # needs `gh auth login` once; soft-fails (backs off) until then
max_items = 20

[sensors.gcal]
enabled = false                        # Google Calendar is empty for this user; Notion holds the schedule

[context]
refresh_hours = 24

[notify]
channels = ["toast"]                   # toast | webhook (configure var/secrets.toml)
digest_times = ["10:30", "22:30"]       # Beijing time
