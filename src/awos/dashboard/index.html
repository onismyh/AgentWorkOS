<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="awos-token" content="__AWOS_TOKEN__">
  <meta name="robots" content="noindex">
  <title>AgentWorkOS 控制台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='21' font-size='14' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EAW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-overview" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/></symbol>
      <symbol id="i-inbox" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 13l2.5-8h11L20 13M4 13v6h16v-6M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></symbol>
      <symbol id="i-outbox" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3m0 0L8 7m4-4l4 4M4 14v6h16v-6"/></symbol>
      <symbol id="i-runs" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4l14 8-14 8z"/></symbol>
      <symbol id="i-tools" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.4-.4-2.6z"/></symbol>
      <symbol id="i-errors" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3l9.5 17h-19zM12 10v4M12 17.5v.01"/></symbol>
      <symbol id="i-artifacts" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h8l4 4v14H6zM14 3v4h4M9 13h6M9 17h6"/></symbol>
      <symbol id="i-context" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></symbol>
      <symbol id="i-sensors" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12v.01M8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 0 0-14.3-4.3L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.3l1.7-1.8M20 20v-4.5h-4.5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AW</div>
        <div>
          <div class="brand-name">AgentWorkOS</div>
          <div class="brand-sub" id="brand-version">个人智能体操作系统</div>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主导航">
        <a href="#/overview" data-view="overview"><svg class="ico"><use href="#i-overview"/></svg>总览</a>
        <a href="#/inbox" data-view="inbox"><svg class="ico"><use href="#i-inbox"/></svg>Inbox<span class="badge" data-badge="inbox" hidden></span></a>
        <a href="#/tasks" data-view="tasks"><svg class="ico"><use href="#i-tasks"/></svg>任务</a>
        <a href="#/outbox" data-view="outbox"><svg class="ico"><use href="#i-outbox"/></svg>Outbox<span class="badge" data-badge="outbox" hidden></span></a>
        <a href="#/runs" data-view="runs"><svg class="ico"><use href="#i-runs"/></svg>运行<span class="badge" data-badge="runs" hidden></span></a>
        <a href="#/tools" data-view="tools"><svg class="ico"><use href="#i-tools"/></svg>工具调用</a>
        <a href="#/errors" data-view="errors"><svg class="ico"><use href="#i-errors"/></svg>异常<span class="badge" data-badge="errors" hidden></span></a>
        <div class="nav-sep"></div>
        <a href="#/artifacts" data-view="artifacts"><svg class="ico"><use href="#i-artifacts"/></svg>交付物</a>
        <a href="#/context" data-view="context"><svg class="ico"><use href="#i-context"/></svg>上下文</a>
        <a href="#/sensors" data-view="sensors"><svg class="ico"><use href="#i-sensors"/></svg>传感器</a>
        <a href="#/history" data-view="history"><svg class="ico"><use href="#i-history"/></svg>历史</a>
      </nav>
      <div class="sidebar-foot">
        <div class="row"><span class="dot-s" id="foot-daemon"></span><span id="foot-daemon-text">守护进程 · 检查中</span></div>
        <div class="row"><span class="dot-s" id="foot-live"></span><span id="foot-live-text">实时推送 · 连接中</span></div>
        <div class="row"><button class="btn ghost sm" data-act="theme" title="切换主题"><svg class="ico"><use href="#i-theme"/></svg><span id="theme-label">跟随系统</span></button></div>
      </div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">总览</h1>
          <div class="sub" id="view-sub"></div>
        </div>
        <button class="stale-pill" id="stale-pill" data-act="refresh">有新动态 · 刷新</button>
        <div class="spacer"></div>
        <button class="btn" data-act="refresh" title="刷新 (R)"><svg class="ico"><use href="#i-refresh"/></svg>刷新</button>
        <button class="btn primary" data-act="new-task" title="新建任务 (N)"><svg class="ico"><use href="#i-plus"/></svg>新建任务</button>
      </header>
      <section class="content" id="view"><div class="loading">加载中…</div></section>
    </main>
  </div>

  <div class="backdrop" id="backdrop" data-act="close-drawer"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="modal-wrap" id="modal-wrap"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>此控制台需要启用 JavaScript。</noscript>
</body>
</html>
