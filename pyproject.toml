[project]
name = "agentworkos"
version = "0.1.0"
description = "AgentWorkOS - a local, proactive personal agent operating system (task center, sensors, HITL outbox, multi-agent executors, dashboard)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
awos = "awos.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/awos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
